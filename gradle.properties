org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Parallel project sync, Gradle 9.4+.
org.gradle.tooling.parallel=true

kotlin.code.style=official

# `iosSimulatorArm64Test` cannot run anywhere but macOS, so on a Linux host — every developer
# machine here, and the CI runner that builds the klibs — the Kotlin plugin warns about it on
# every single invocation. The task is still declared and still runs on macOS; this only silences
# the notice on the hosts where being unable to run it is the expected state.
kotlin.native.ignoreDisabledTargets=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# Same declined suggestion as in the client repository: AGP 9 reports this flag's own replacement
# as deprecated the moment it is set, and the replacement drops constraints AGP publishes between
# library components — a resolution change, to quiet a sync-time nag about very large projects.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
