org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Parallel project sync, Gradle 9.4+.
org.gradle.tooling.parallel=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# Same declined suggestion as in the client repository: AGP 9 reports this flag's own replacement
# as deprecated the moment it is set, and the replacement drops constraints AGP publishes between
# library components — a resolution change, to quiet a sync-time nag about very large projects.
android.generateSyncIssueWhenLibraryConstraintsAreEnabled=false
